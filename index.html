<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f7f8f5">
<meta name="description" content="Michael — Software Developer">
<title>Michael — Software Developer</title>
<style>
:root{
  color-scheme:light;
  --bg:#f7f8f5;--surface:#fff;--soft:#f0f2ed;--ink:#17201c;--muted:#68736c;
  --line:#d8ded8;--strong:#aab5ac;--accent:#315b48;--accent-soft:#e5eee8;
  --grid:rgba(49,91,72,.055);--shadow:0 20px 60px rgba(25,42,32,.08);
  --max:1120px;--ease:cubic-bezier(.22,1,.36,1);
}
html[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0f1511;--surface:#161e19;--soft:#1c2721;--ink:#edf3ee;--muted:#a3b0a7;
  --line:#2e3b33;--strong:#56665b;--accent:#a8d5b8;--accent-soft:#233629;
  --grid:rgba(168,213,184,.05);--shadow:0 20px 60px rgba(0,0,0,.3);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:90px}
body{
  margin:0;min-width:320px;overflow-x:hidden;color:var(--ink);background:var(--bg);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.6;
  transition:background-color .35s,color .35s;
}
::selection{background:var(--accent);color:var(--bg)}
a{color:inherit;text-decoration:none}
button{font:inherit}
svg{display:block}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
.wrap{width:min(var(--max),calc(100% - 180px));margin-inline:auto}
.muted{color:var(--muted)}

/* ---------- Tech background ---------- */
.bg{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.bg::before{
  content:"";position:absolute;inset:0;
  background:
    linear-gradient(var(--grid) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:44px 44px;
  mask-image:radial-gradient(ellipse at 50% 30%,#000 30%,transparent 85%);
  -webkit-mask-image:radial-gradient(ellipse at 50% 30%,#000 30%,transparent 85%);
  animation:grid-drift 30s linear infinite;
}
.bg canvas{position:absolute;inset:0;width:100%;height:100%}
.scan{
  position:absolute;left:0;right:0;top:-2px;height:2px;
  background:linear-gradient(90deg,transparent,var(--accent),transparent);opacity:.18;
  animation:scan 11s linear infinite;
}
@keyframes grid-drift{to{background-position:44px 44px,44px 44px}}
@keyframes scan{to{transform:translateY(105vh)}}

.progress{position:fixed;top:0;left:0;z-index:100;width:100%;height:2px;background:var(--accent);transform:scaleX(0);transform-origin:left;will-change:transform}

/* ---------- Nav ---------- */
.topbar{position:sticky;top:0;z-index:50;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(16px)}
.nav{min-height:68px;display:flex;align-items:center;justify-content:space-between;gap:24px}
.brand{display:inline-flex;align-items:center;gap:11px;font-weight:800;letter-spacing:-.04em;font-size:.95rem}
.brand-mark{width:34px;height:34px;display:grid;place-items:center;border:1.5px solid var(--accent);border-radius:10px;color:var(--accent);font-size:.82rem;transition:transform .4s var(--ease)}
.brand:hover .brand-mark{transform:rotate(-8deg)}
.nav-links{display:flex;gap:30px}
.nav-links a{position:relative;padding:8px 0;color:var(--muted);font-size:.85rem;font-weight:650;transition:color .2s}
.nav-links a::after{content:"";position:absolute;left:0;bottom:2px;width:100%;height:1px;background:var(--accent);transform:scaleX(0);transform-origin:right;transition:transform .35s var(--ease)}
.nav-links a:hover,.nav-links a.active{color:var(--ink)}
.nav-links a:hover::after,.nav-links a.active::after{transform:scaleX(1);transform-origin:left}
.nav-actions{display:flex;gap:10px}
.icon-btn{width:40px;height:40px;display:grid;place-items:center;border:1px solid var(--strong);border-radius:11px;background:var(--surface);color:var(--ink);cursor:pointer;transition:border-color .2s,transform .3s var(--ease)}
.icon-btn:hover{border-color:var(--accent);transform:translateY(-2px)}
.icon-btn svg{width:18px;height:18px}
.menu-toggle{display:none}

/* ---------- Hero (one orchestrated entrance) ---------- */
.hero{padding:clamp(40px,5vw,64px) 0 8px}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,.7fr);gap:clamp(24px,5vw,60px);align-items:center}
.hero .rise{opacity:0;animation:rise .9s var(--ease) forwards;animation-delay:calc(var(--d,0)*120ms + 100ms)}
.eyebrow{display:inline-flex;align-items:center;gap:10px;color:var(--muted);font:600 .8rem ui-monospace,SFMono-Regular,Menlo,monospace}
.eyebrow::before{content:">";color:var(--accent)}
.eyebrow::after{content:"";width:8px;height:15px;background:var(--accent);animation:blink 1.1s steps(1) infinite}
h1{margin:18px 0 20px;font-size:clamp(2.5rem,5.8vw,5.4rem);line-height:1;letter-spacing:-.08em;font-weight:790}
h1 .line{display:block;overflow:hidden;padding:.04em .08em .18em 0;margin:-.04em 0 -.12em}
h1 .line>span{display:inline-block;transform:translateY(110%);animation:line-up 1s var(--ease) forwards;animation-delay:calc(var(--d,0)*140ms + 250ms)}
h1 .accent{color:var(--accent)}
.lead{max-width:620px;margin:0;color:var(--muted);font-size:clamp(1rem,1.6vw,1.1rem);line-height:1.85}
.hero-actions{margin-top:30px}
.btn{min-height:48px;display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:0 20px;border:1px solid var(--ink);border-radius:12px;background:var(--ink);color:var(--bg);font-size:.86rem;font-weight:720;cursor:pointer;transition:background .25s,border-color .25s,transform .3s var(--ease)}
.btn:hover{background:var(--accent);border-color:var(--accent);transform:translateY(-3px)}
.btn svg{width:16px;height:16px;transition:transform .3s var(--ease)}
.btn:hover svg{transform:translateX(3px)}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--strong)}
.btn.ghost:hover{background:var(--surface);color:var(--accent);border-color:var(--accent)}

.card{border:1px solid var(--line);background:var(--surface);border-radius:18px}

/* Hero orbit: skills circling a core */
.orbit{position:relative;width:min(100%,430px);aspect-ratio:1;margin-inline:auto}
.orbit .glow{position:absolute;inset:6%;border-radius:50%;background:radial-gradient(circle,var(--accent-soft),transparent 68%)}
.ring{position:absolute;border:1px dashed var(--strong);border-radius:50%;animation:spin var(--t) linear infinite}
.ring::before{content:"";position:absolute;top:-4px;left:50%;width:7px;height:7px;margin-left:-3px;border-radius:50%;background:var(--accent)}
.r1{inset:0;--t:70s}
.r2{inset:19%;--t:48s;animation-direction:reverse}
.r3{inset:36%;--t:30s}
.sat{position:absolute;left:calc(50% + 50% * cos(var(--a)));top:calc(50% + 50% * sin(var(--a)));transform:translate(-50%,-50%)}
.chip{display:block;padding:6px 11px;border:1px solid var(--strong);border-radius:999px;background:var(--surface);color:var(--ink);font:650 .7rem ui-monospace,monospace;white-space:nowrap;box-shadow:0 6px 18px rgba(25,42,32,.1);animation:spin var(--t) linear infinite reverse}
.r2 .chip{animation-direction:normal}
.core{position:absolute;inset:41%;display:grid;place-items:center;border:1px solid var(--accent);border-radius:50%;background:var(--surface);color:var(--accent);font-size:clamp(1rem,2.4vw,1.5rem);font-weight:780;letter-spacing:-.08em;animation:pulse 3s ease-in-out infinite}
#about{background:color-mix(in srgb,var(--soft) 60%,transparent);border-block:1px solid var(--line);padding:64px 0}
.stack{display:flex;flex-wrap:wrap;gap:6px}
.stk{padding:3px 8px;border-radius:6px;background:var(--soft);color:var(--muted);font:650 .66rem ui-monospace,monospace}

/* ---------- Sections ---------- */
.section{padding:52px 0}
.section-head{position:relative;padding-bottom:22px;margin-bottom:28px}
.section-head::after{content:"";position:absolute;left:0;bottom:0;width:100%;height:1px;background:var(--line-strong,var(--strong));transform:scaleX(0);transform-origin:left;transition:transform 1.1s var(--ease) .2s}
.section-head.in::after{transform:scaleX(1)}
.section-head h2{margin:10px 0 0;font-size:clamp(2rem,4.4vw,3.5rem);line-height:1.02;letter-spacing:-.07em}
.section-desc{max-width:520px;margin:12px 0 0;color:var(--muted);font-size:.9rem;line-height:1.8}

/* Scroll reveal: staggered, with a slight blur-in */
.motion [data-r]{opacity:0;transform:translateY(26px) scale(.98);filter:blur(5px);transition:opacity .8s var(--ease),transform .8s var(--ease),filter .8s var(--ease);transition-delay:calc(var(--i,0)*90ms)}
.motion [data-r].in{opacity:1;transform:none;filter:none}

/* Apps */
.apps-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.app{position:relative;display:flex;flex-direction:column;min-height:300px;padding:24px;overflow:hidden;transition:border-color .3s,box-shadow .3s,transform .5s var(--ease),opacity .8s var(--ease),filter .8s var(--ease)}
.app::before{content:"";position:absolute;left:0;top:0;height:2px;width:100%;background:var(--accent);transform:scaleX(0);transform-origin:left;transition:transform .5s var(--ease)}
.app::after{content:"";position:absolute;right:-60px;top:-60px;width:150px;height:150px;border:1px dashed var(--strong);border-radius:50%;opacity:.35;transition:transform .8s var(--ease)}
.app:hover{border-color:var(--accent);box-shadow:var(--shadow);transform:translateY(-6px)}
.app:hover::before{transform:scaleX(1)}
.app:hover::after{transform:rotate(90deg) scale(1.1)}
.app-head{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:center;gap:12px}
.app-icon{width:52px;height:52px;display:grid;place-items:center;border:1px solid var(--strong);border-radius:15px;color:var(--accent);background:var(--soft);transition:transform .5s var(--ease),background .3s}
.app:hover .app-icon{transform:rotate(-6deg) scale(1.06);background:var(--accent-soft)}
.app-icon svg{width:24px;height:24px}
.tag{padding:5px 9px;border:1px solid var(--line);border-radius:7px;color:var(--muted);font-size:.68rem;font-weight:700}
.app h3{position:relative;z-index:1;margin:24px 0 9px;font-size:1.22rem;letter-spacing:-.045em}
.app p{position:relative;z-index:1;margin:0;color:var(--muted);font-size:.84rem;line-height:1.8}
.app-foot{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-top:auto;padding-top:22px}

.btn.small{min-height:38px;padding:0 13px;border-radius:9px;font-size:.76rem}

/* About */
.about-grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:16px}
.panel{padding:clamp(24px,4vw,34px);transition:border-color .3s,box-shadow .3s,transform .5s var(--ease),opacity .8s var(--ease),filter .8s var(--ease)}
.panel:hover{border-color:var(--strong);box-shadow:var(--shadow)}
.panel h3{margin:0 0 12px;font-size:1.15rem;letter-spacing:-.04em}
.panel>p{margin:0;color:var(--muted);font-size:.9rem;line-height:1.85}
.skills{display:flex;flex-wrap:wrap;gap:9px;margin-top:24px}
.skill{padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--soft);color:var(--muted);font:650 .74rem ui-monospace,monospace;opacity:1;transition:color .25s,background .25s,border-color .25s,transform .3s var(--ease),opacity .6s var(--ease)}
.skill:hover{color:var(--accent);background:var(--accent-soft);border-color:var(--accent);transform:translateY(-3px)}
.motion .skills .skill{opacity:0;transform:translateY(10px)}
.motion .in .skills .skill,.motion .skills.in .skill{opacity:1;transform:none;transition-delay:calc(var(--k,0)*45ms + 250ms)}
.principles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:22px}
.principle{padding:15px;border:1px solid var(--line);border-radius:12px;transition:border-color .25s,background .25s,transform .3s var(--ease)}
.principle:hover{border-color:var(--accent);background:var(--soft);transform:translateY(-3px)}
.principle strong{display:block;margin-bottom:3px;font-size:.84rem}
.principle span{color:var(--muted);font-size:.76rem}

/* Contact + footer */
.contact{display:flex;justify-content:space-between;align-items:center;gap:24px;margin-block:44px 56px;padding:clamp(24px,4vw,40px);border:1px solid var(--strong);border-radius:20px;background:var(--surface);box-shadow:var(--shadow)}
.contact h2{margin:0;font-size:clamp(1.8rem,3.6vw,2.7rem);line-height:1.1;letter-spacing:-.06em}
.contact p{margin:8px 0 0;color:var(--muted);font-size:.88rem}
footer{border-top:1px solid var(--line);background:color-mix(in srgb,var(--surface) 55%,transparent)}
.footer-inner{min-height:68px;display:flex;align-items:center;color:var(--muted);font-size:.76rem}

/* ---------- Social rail: fixed, right-middle ---------- */
.rail{position:fixed;right:14px;top:50%;z-index:60;transform:translateY(-50%);display:flex;flex-direction:column;gap:8px;padding:10px;border:1px solid var(--strong);border-radius:18px;background:var(--surface);box-shadow:0 12px 40px rgba(25,42,32,.2);animation:rail-in .9s var(--ease) .7s both}
.rail a{position:relative;width:46px;height:46px;display:grid;place-items:center;border:1px solid var(--line);border-radius:13px;color:var(--accent);background:var(--accent-soft);transition:color .2s,background .2s,border-color .2s,transform .3s var(--ease)}
.rail a:hover,.rail a:focus-visible{color:var(--bg);background:var(--accent);border-color:var(--accent);transform:translateX(-4px)}
.rail svg{width:22px;height:22px}
.rail a::after{content:attr(data-label);position:absolute;right:calc(100% + 12px);top:50%;padding:5px 9px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--ink);font-size:.72rem;font-weight:700;white-space:nowrap;opacity:0;pointer-events:none;transform:translate(6px,-50%);transition:opacity .2s,transform .3s var(--ease)}
.rail a:hover::after,.rail a:focus-visible::after{opacity:1;transform:translate(0,-50%)}

@keyframes rise{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
@keyframes line-up{to{transform:none}}
@keyframes rail-in{from{opacity:0;transform:translate(30px,-50%)}to{opacity:1;transform:translate(0,-50%)}}
@keyframes blink{50%{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 6px var(--accent-soft)}50%{box-shadow:0 0 0 16px transparent}}

/* ---------- Responsive ---------- */
@media (max-width:950px){.apps-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:800px){
  .hero-grid,.about-grid{grid-template-columns:1fr}
  .orbit{width:min(100%,340px);margin-top:12px}
  .section-head{flex-direction:column;align-items:flex-start}
}
@media (max-width:620px){
  .wrap{width:calc(100% - 82px);margin-left:18px;margin-right:auto}
  .menu-toggle{display:grid}
  .nav-links{display:none;position:absolute;top:68px;left:0;right:0;flex-direction:column;gap:0;padding:8px 20px 14px;border-bottom:1px solid var(--line);background:var(--bg)}
  .nav-links.open{display:flex;animation:rise .3s var(--ease) both}
  .nav-links a{padding:13px 0;border-bottom:1px solid var(--line)}
  .nav-links a:last-child{border-bottom:0}
  .apps-grid{grid-template-columns:1fr}
  .section{padding:40px 0}
  .contact{flex-direction:column;align-items:flex-start}
  .rail{right:8px;padding:6px;gap:5px}
  .rail a{width:38px;height:38px}
  .rail svg{width:19px;height:19px}
  .rail a::after{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
  .hero .rise{opacity:1}
  h1 .line>span{transform:none}
  .scan{display:none}
}
</style>
</head>

    github:'<path d="M9 19c-4.3 1.4-4.3-2.1-6-2.5"/><path d="M15 21v-3.5a3 3 0 0 0-.8-2.3c2.7-.3 5.5-1.3 5.5-6A4.7 4.7 0 0 0 18.5 6a4.3 4.3 0 0 0-.1-3S17.4 2.7 15 4.3a13 13 0 0 0-6 0C6.6 2.7 5.6 3 5.6 3a4.3 4.3 0 0 0-.1 3 4.7 4.7 0 0 0-1.2 3.3c0 4.7 2.8 5.7 5.5 6A3 3 0 0 0 9 17.5V21"/>',
    website:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a14 14 0 0 1 0 18"/><path d="M12 3a14 14 0 0 0 0 18"/>',
    x: '<path d="M18.9 2H22l-6.8 7.8L23.2 22h-6.3l-4.9-7.4L5.5 22H2.3l7.3-8.4L1.8 2h6.5l4.4 6.8L18.9 2z"/><path d="M17.8 20h1.7L7.4 3.9H5.6z"/>',
tiktok: '<path d="M12 2v13.5a4.5 4.5 0 1 1-4-4.47"/><path d="M12 2c.5 3.5 2.5 5.5 6 6"/>',
    book:'<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 5.5v15M8 7h8M8 11h7"/>',
    cpu:'<rect x="5" y="5" width="14" height="14" rx="2"/><rect x="9" y="9" width="6" height="6" rx="1"/><path d="M9 2v3m6-3v3m-6 14v3m6-3v3M2 9h3m-3 6h3m14-6h3m-3 6h3"/>',
    tag:'<path d="M20.5 13.5 13 21l-10-10V3h8z"/><circle cx="7.5" cy="7.5" r="1.3"/>',
    moon:'<path d="M20.2 15.3A8.4 8.4 0 0 1 8.7 3.8 8.5 8.5 0 1 0 20.2 15.3Z"/>',
    sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M4.9 19.1l1.4-1.4m11.4-11.4 1.4-1.4"/>',
    menu:'<path d="M4 7h16M4 12h16M4 17h16"/>'
  };

  function el(tag, cls = "", text) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function icon(name) {
    const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    s.setAttribute("viewBox", "0 0 24 24");
    s.setAttribute("fill", "none");
    s.setAttribute("stroke", "currentColor");
    s.setAttribute("stroke-width", "1.7");
    s.setAttribute("stroke-linecap", "round");
    s.setAttribute("stroke-linejoin", "round");
    s.setAttribute("aria-hidden", "true");
    s.innerHTML = ICONS[name] || "";
    return s;
  }
  function link(label, href, cls = "") {
    const a = el("a", cls, label);
    a.href = href;
    if (/^https?:/i.test(href)) { a.target = "_blank"; a.rel = "noopener noreferrer"; }
    return a;
  }
  function head(title, desc) {
    const h = el("div", "section-head");
    h.dataset.head = "";
    const t = el("h2");
    title.forEach((l, i) => { if (i) t.append(document.createElement("br")); t.append(l); });
    h.append(t);
    if (desc) h.append(el("p", "section-desc", desc));
    return h;
  }

  /* ---------- Nav + theme ---------- */
  function renderNav() {
    const box = $("#nav");
    const brand = link("", "#home", "brand");
    brand.setAttribute("aria-label", D.brand.name + " home");
    const name = el("span");
    name.append(D.brand.name + " ", el("span", "muted", D.brand.suffix));
    brand.append(el("span", "brand-mark", D.brand.mark), name);

    const nav = el("nav", "nav-links");
    nav.id = "site-nav";
    nav.setAttribute("aria-label", "Main navigation");
    D.nav.forEach(i => nav.append(link(i.label, i.href)));

    const theme = el("button", "icon-btn");
    theme.type = "button";
    const menu = el("button", "icon-btn menu-toggle");
    menu.type = "button";
    menu.setAttribute("aria-controls", "site-nav");
    menu.setAttribute("aria-expanded", "false");
    menu.setAttribute("aria-label", D.ui.open);
    menu.append(icon("menu"));

    const actions = el("div", "nav-actions");
    actions.append(theme, menu);
    box.append(brand, nav, actions);

    menu.addEventListener("click", () => {
      const open = nav.classList.toggle("open");
      menu.setAttribute("aria-expanded", String(open));
      menu.setAttribute("aria-label", open ? D.ui.close : D.ui.open);
    });
    $$("a", nav).forEach(a => a.addEventListener("click", () => {
      nav.classList.remove("open");
      menu.setAttribute("aria-expanded", "false");
    }));

    const KEY = "michael-portfolio-theme";
    const meta = $('meta[name="theme-color"]');
    function setTheme(t, save) {
      const dark = t === "dark";
      root.dataset.theme = dark ? "dark" : "light";
      theme.replaceChildren(icon(dark ? "sun" : "moon"));
      const label = dark ? D.ui.toLight : D.ui.toDark;
      theme.setAttribute("aria-label", label);
      theme.title = label;
      meta.setAttribute("content", dark ? "#0f1511" : "#f7f8f5");
      if (save) { try { localStorage.setItem(KEY, t); } catch (e) {} }
      window.dispatchEvent(new Event("themechange"));
    }
    let t = "light";
    try { const s = localStorage.getItem(KEY); if (s === "dark" || s === "light") t = s; } catch (e) {}
    setTheme(t, false);
    theme.addEventListener("click", () => setTheme(root.dataset.theme === "dark" ? "light" : "dark", true));
  }

  /* ---------- Social rail ---------- */
  function renderRail() {
    const rail = $("#rail");
    D.socials.forEach(s => {
      const a = link("", s.url);
      a.dataset.label = s.name;
      a.setAttribute("aria-label", s.name);
      a.append(icon(s.icon));
      rail.append(a);
    });
  }

  /* ---------- Hero ---------- */
  function renderHero() {
    const h = D.hero;
    const copy = el("div");
    const eb = el("span", "eyebrow rise", h.eyebrow);
    eb.style.setProperty("--d", 0);

    const title = el("h1");
    h.lines.forEach((l, i) => {
      const line = el("span", "line");
      const inner = el("span", i === h.lines.length - 1 ? "accent" : "", l);
      inner.style.setProperty("--d", i);
      line.append(inner);
      title.append(line);
    });

    const lead = el("p", "lead rise", h.description);
    lead.style.setProperty("--d", 3);
    const actions = el("div", "hero-actions rise");
    actions.style.setProperty("--d", 4);
    const btn = link(h.button.label, h.button.href, "btn");
    btn.append(icon("arrow"));
    actions.append(btn);
    copy.append(eb, title, lead, actions);


    const skills = D.about.panels[0].skills;
    const orbit = el("div", "orbit rise");
    orbit.style.setProperty("--d", 2);
    orbit.setAttribute("aria-hidden", "true");
    orbit.append(el("div", "glow"));
    [
      { cls: "r1", pick: [0, 1, 2, 3], off: 45 },
      { cls: "r2", pick: [8, 6, 11], off: 90 },
      { cls: "r3", pick: [], off: 0 }
    ].forEach(r => {
      const ring = el("div", "ring " + r.cls);
      r.pick.forEach((idx, i) => {
        const sat = el("div", "sat");
        sat.style.setProperty("--a", (i * 360 / r.pick.length + r.off) + "deg");
        sat.append(el("span", "chip", skills[idx % skills.length]));
        ring.append(sat);
      });
      orbit.append(ring);
    });
    orbit.append(el("div", "core", D.brand.mark));
    $("#hero").append(copy, orbit);
  }

  /* ---------- Apps (now first) ---------- */
  function renderApps() {
    const box = $("#apps-box"), d = D.apps;
    box.append(head([d.title], d.description));
    const grid = el("div", "apps-grid");
    d.items.forEach((a, i) => {
      const card = el("article", "card app");
      card.dataset.r = "";
      card.style.setProperty("--i", i);
      const ic = el("div", "app-icon");
      ic.append(icon(a.icon));
      const hd = el("div", "app-head");
      hd.append(ic, el("span", "tag", a.type));
      const dl = link(a.label, a.url, "btn small");
      dl.append(icon("download"));
      const ft = el("div", "app-foot");
      const stack = el("span", "stack");
      a.stack.split("·").forEach(t => stack.append(el("span", "stk", t.trim())));
      ft.append(stack, dl);
      card.append(hd, el("h3", "", a.name), el("p", "", a.description), ft);
      grid.append(card);
    });
    box.append(grid);
  }

  /* ---------- About ---------- */
  function renderAbout() {
    const box = $("#about-box"), d = D.about;
    box.append(head(d.title, d.description));
    const grid = el("div", "about-grid");
    d.panels.forEach((p, i) => {
      const art = el("article", "card panel");
      art.dataset.r = "";
      art.style.setProperty("--i", i);
      art.append(el("h3", "", p.title), el("p", "", p.description));
      if (p.skills) {
        const list = el("div", "skills");
        p.skills.forEach((s, k) => {
          const chip = el("span", "skill", s);
          chip.style.setProperty("--k", k);
          list.append(chip);
        });
        art.append(list);
      }
      if (p.principles) {
        const wrap = el("div", "principles");
        p.principles.forEach(x => {
          const it = el("div", "principle");
          it.append(el("strong", "", x.title), el("span", "", x.description));
          wrap.append(it);
        });
        art.append(wrap);
      }
      grid.append(art);
    });
    box.append(grid);
  }

  /* ---------- Contact + footer ---------- */
  function renderContact() {
    const c = D.contact, box = $("#contact");
    const copy = el("div");
    copy.append(el("h2", "", c.title), el("p", "", c.description));
    const b = link(c.button, "mailto:" + c.email, "btn");
    b.append(icon("mail"));
    box.append(copy, b);
    box.dataset.r = "";
    $("#footer").append(el("span", "", D.footer.replace("{year}", new Date().getFullYear())));
  }

  /* ---------- Scroll reveal, progress, active nav ---------- */
  function setupScroll() {
    const bar = $("#progress");
    let tick = false;
    function update() {
      const max = document.documentElement.scrollHeight - innerHeight;
      bar.style.transform = "scaleX(" + (max > 0 ? Math.min(1, scrollY / max) : 0) + ")";
      tick = false;
    }
    addEventListener("scroll", () => { if (!tick) { tick = true; requestAnimationFrame(update); } }, { passive: true });
    update();

    if (!("IntersectionObserver" in window)) return;

    if (!reduced) {
      root.classList.add("motion");
      const io = new IntersectionObserver(es => es.forEach(e => {
        if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); }
      }), { threshold: 0.12, rootMargin: "0px 0px -40px 0px" });
      $$("[data-r], [data-head], .skills").forEach(n => io.observe(n));
    }

    const links = $$(".nav-links a");
    const so = new IntersectionObserver(es => es.forEach(e => {
      if (!e.isIntersecting) return;
      links.forEach(a => {
        const on = a.getAttribute("href") === "#" + e.target.id;
        a.classList.toggle("active", on);
        on ? a.setAttribute("aria-current", "location") : a.removeAttribute("aria-current");
      });
    }), { rootMargin: "-30% 0px -55% 0px" });
    $$("main section[id]").forEach(s => so.observe(s));
  }

  /* ---------- Network background (nodes + links) ---------- */
  function setupNetwork() {
    const cv = $("#net"), ctx = cv.getContext("2d");
    let w, h, dpr, nodes = [], color = "49,91,72", raf, running = true;

    function readColor() {
      const c = getComputedStyle(root).getPropertyValue("--accent").trim();
      const m = /^#([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(c);
      if (m) color = parseInt(m[1], 16) + "," + parseInt(m[2], 16) + "," + parseInt(m[3], 16);
    }
    function resize() {
      dpr = Math.min(devicePixelRatio || 1, 2);
      w = innerWidth; h = innerHeight;
      cv.width = w * dpr; cv.height = h * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const count = Math.min(70, Math.floor(w * h / 24000));
      nodes = Array.from({ length: count }, () => ({
        x: Math.random() * w, y: Math.random() * h,
        vx: (Math.random() - .5) * .22, vy: (Math.random() - .5) * .22,
        r: Math.random() < .15 ? 2.2 : 1.2
      }));
    }
    function draw() {
      ctx.clearRect(0, 0, w, h);
      const max = 150;
      for (const n of nodes) {
        if (!reduced) {
          n.x += n.vx; n.y += n.vy;
          if (n.x < 0 || n.x > w) n.vx *= -1;
          if (n.y < 0 || n.y > h) n.vy *= -1;
        }
        ctx.fillStyle = "rgba(" + color + ",.5)";
        ctx.beginPath(); ctx.arc(n.x, n.y, n.r, 0, 6.283); ctx.fill();
      }
      for (let i = 0; i < nodes.length; i++) {
        for (let j = i + 1; j < nodes.length; j++) {
          const a = nodes[i], b = nodes[j];
          const d = Math.hypot(a.x - b.x, a.y - b.y);
          if (d < max) {
            ctx.strokeStyle = "rgba(" + color + "," + (.24 * (1 - d / max)) + ")";
            ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
          }
        }
      }
    }
    function loop() { if (!running) return; draw(); raf = requestAnimationFrame(loop); }

    readColor(); resize(); draw();
    if (!reduced) loop();
    addEventListener("resize", () => { resize(); draw(); });
    addEventListener("themechange", () => { readColor(); draw(); });
    document.addEventListener("visibilitychange", () => {
      if (reduced) return;
      running = !document.hidden;
      if (running) loop(); else cancelAnimationFrame(raf);
    });
  }

  /* ---------- Init ---------- */
  D.hero && (document.title = "Michael — Software Developer");
  renderNav();
  renderRail();
  renderHero();
  renderApps();
  renderAbout();
  renderContact();
  setupScroll();
  setupNetwork();
})();
</script>
